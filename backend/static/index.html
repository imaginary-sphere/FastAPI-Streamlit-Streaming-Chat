<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Chat</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0f0f0f;
      color: #e8e8e8;
      height: 100dvh;
      display: flex;
    }

    /* ── Sidebar ── */
    #sidebar {
      width: 240px;
      background: #1a1a1a;
      border-right: 1px solid #2a2a2a;
      display: flex;
      flex-direction: column;
      padding: 20px 16px;
      gap: 16px;
      flex-shrink: 0;
    }

    #sidebar h2 { font-size: 15px; font-weight: 600; color: #fff; }

    #sidebar label { font-size: 12px; color: #888; margin-bottom: 4px; display: block; }

    #model-select {
      width: 100%;
      background: #2a2a2a;
      border: 1px solid #3a3a3a;
      color: #e8e8e8;
      padding: 8px 10px;
      border-radius: 8px;
      font-size: 13px;
      cursor: pointer;
    }

    #clear-btn {
      margin-top: auto;
      background: #2a2a2a;
      border: 1px solid #3a3a3a;
      color: #e8e8e8;
      padding: 9px;
      border-radius: 8px;
      font-size: 13px;
      cursor: pointer;
      transition: background 0.15s;
    }
    #clear-btn:hover { background: #333; }

    /* ── Main ── */
    #main {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    #messages {
      flex: 1;
      overflow-y: auto;
      padding: 24px 20px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .msg {
      display: flex;
      gap: 12px;
      max-width: 760px;
      width: 100%;
      align-self: center;
    }

    .msg .avatar {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      font-weight: 700;
      flex-shrink: 0;
    }

    .msg.user .avatar { background: #4f46e5; color: #fff; }
    .msg.assistant .avatar { background: #16a34a; color: #fff; }

    .msg .bubble {
      background: #1e1e1e;
      border: 1px solid #2a2a2a;
      border-radius: 12px;
      padding: 12px 16px;
      font-size: 14px;
      line-height: 1.6;
      white-space: pre-wrap;
      word-break: break-word;
      flex: 1;
    }

    .msg.user .bubble { background: #1e1e3a; border-color: #2a2a5a; }

    /* ── Input area ── */
    #input-area {
      padding: 16px 20px 24px;
      display: flex;
      justify-content: center;
    }

    #input-wrap {
      display: flex;
      align-items: flex-end;
      gap: 8px;
      width: 100%;
      max-width: 760px;
      background: #1e1e1e;
      border: 1px solid #3a3a3a;
      border-radius: 12px;
      padding: 10px 12px;
    }

    #user-input {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      color: #e8e8e8;
      font-size: 14px;
      resize: none;
      max-height: 160px;
      line-height: 1.5;
      font-family: inherit;
    }

    #send-btn {
      background: #4f46e5;
      border: none;
      color: #fff;
      width: 34px;
      height: 34px;
      border-radius: 8px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: background 0.15s;
    }
    #send-btn:hover { background: #4338ca; }
    #send-btn:disabled { background: #333; cursor: not-allowed; }

    #send-btn svg { width: 16px; height: 16px; }

    .cursor { display: inline-block; width: 2px; height: 14px; background: #e8e8e8; animation: blink 1s infinite; vertical-align: text-bottom; }
    @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0} }

    .empty-state {
      margin: auto;
      text-align: center;
      color: #555;
    }
    .empty-state h1 { font-size: 22px; margin-bottom: 8px; color: #777; }
    .empty-state p { font-size: 14px; }
  </style>
</head>
<body>

<div id="sidebar">
  <h2>⚙️ Settings</h2>
  <div>
    <label for="model-select">Model</label>
    <select id="model-select"></select>
  </div>
  <button id="clear-btn">🗑 Clear conversation</button>
</div>

<div id="main">
  <div id="messages">
    <div class="empty-state">
      <h1>AI Chat</h1>
      <p>Send a message to start.</p>
    </div>
  </div>
  <div id="input-area">
    <div id="input-wrap">
      <textarea id="user-input" rows="1" placeholder="Message AI..."></textarea>
      <button id="send-btn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="22" y1="2" x2="11" y2="13"></line>
          <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
        </svg>
      </button>
    </div>
  </div>
</div>

<script>
  const messagesEl = document.getElementById('messages');
  const inputEl = document.getElementById('user-input');
  const sendBtn = document.getElementById('send-btn');
  const modelSelect = document.getElementById('model-select');
  const clearBtn = document.getElementById('clear-btn');

  let history = [];
  let streaming = false;

  // Load models
  fetch('/models').then(r => r.json()).then(data => {
    data.models.forEach(m => {
      const opt = document.createElement('option');
      opt.value = opt.textContent = m;
      modelSelect.appendChild(opt);
    });
  });

  // Auto-resize textarea
  inputEl.addEventListener('input', () => {
    inputEl.style.height = 'auto';
    inputEl.style.height = Math.min(inputEl.scrollHeight, 160) + 'px';
  });

  // Send on Enter (Shift+Enter = newline)
  inputEl.addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      send();
    }
  });

  sendBtn.addEventListener('click', send);
  clearBtn.addEventListener('click', () => {
    history = [];
    messagesEl.innerHTML = `
      <div class="empty-state">
        <h1>AI Chat</h1>
        <p>Send a message to start.</p>
      </div>`;
  });

  function addMessage(role, content) {
    const empty = messagesEl.querySelector('.empty-state');
    if (empty) empty.remove();

    const div = document.createElement('div');
    div.className = `msg ${role}`;
    div.innerHTML = `
      <div class="avatar">${role === 'user' ? 'U' : 'AI'}</div>
      <div class="bubble"></div>`;
    messagesEl.appendChild(div);
    messagesEl.scrollTop = messagesEl.scrollHeight;
    return div.querySelector('.bubble');
  }

  async function send() {
    const text = inputEl.value.trim();
    if (!text || streaming) return;

    inputEl.value = '';
    inputEl.style.height = 'auto';

    history.push({ role: 'user', content: text });
    addMessage('user', text).textContent = text;

    streaming = true;
    sendBtn.disabled = true;

    const bubble = addMessage('assistant', '');
    const cursor = document.createElement('span');
    cursor.className = 'cursor';
    bubble.appendChild(cursor);

    let fullText = '';

    try {
      const resp = await fetch('/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ messages: history, model: modelSelect.value }),
      });

      const reader = resp.body.getReader();
      const decoder = new TextDecoder();
      let buffer = '';

      while (true) {
        const { done, value } = await reader.read();
        if (done) break;

        buffer += decoder.decode(value, { stream: true });
        const parts = buffer.split('\n\n');
        buffer = parts.pop();

        for (const part of parts) {
          for (const line of part.split('\n')) {
            if (!line.startsWith('data: ')) continue;
            const payload = line.slice(6).trim();
            if (payload === '[DONE]') break;
            const data = JSON.parse(payload);
            if (data.error) { fullText = `⚠️ ${data.error}`; break; }
            if (data.content) {
              fullText += data.content;
              bubble.textContent = fullText;
              bubble.appendChild(cursor);
              messagesEl.scrollTop = messagesEl.scrollHeight;
            }
          }
        }
      }
    } catch (e) {
      fullText = `⚠️ ${e.message}`;
    }

    cursor.remove();
    bubble.textContent = fullText;
    history.push({ role: 'assistant', content: fullText });
    streaming = false;
    sendBtn.disabled = false;
    inputEl.focus();
  }
</script>
</body>
</html>
